# Quarterly Uber pickup demand pipeline.
# Complete pipeline: storage, ingestion, PySpark validation and release,
# and the scheduler that runs them on a timetable.
#   docker compose up -d --build

name: ${COMPOSE_PROJECT_NAME:-uber-pipeline}

# Settings shared by every service
x-common: &common
  networks: [pipeline-net]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-seaweedfs: &seaweedfs
  <<: *common
  image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.17}
  entrypoint: ["weed"]

services:
  master:
    <<: *seaweedfs
    hostname: master
    # 001 = keep one extra copy on a different volume server
    command: >-
      master -ip=master -ip.bind=0.0.0.0 -port=9333 -mdir=/data
      -defaultReplication=001 -volumeSizeLimitMB=256
    ports: ["127.0.0.1:9333:9333"]
    volumes: [master-data:/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  volume1:
    <<: *seaweedfs
    hostname: volume1
    command: >-
      volume -ip=volume1 -ip.bind=0.0.0.0 -port=8080 -master=master:9333
      -dir=/data -max=100 -dataCenter=dc1 -rack=rack1
    volumes: [volume1-data:/data]
    mem_limit: 512m
    depends_on:
      master: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  volume2:
    <<: *seaweedfs
    hostname: volume2
    command: >-
      volume -ip=volume2 -ip.bind=0.0.0.0 -port=8080 -master=master:9333
      -dir=/data -max=100 -dataCenter=dc1 -rack=rack1
    volumes: [volume2-data:/data]
    mem_limit: 512m
    depends_on:
      master: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  filer:
    <<: *seaweedfs
    hostname: filer
    command: >-
      filer -ip=filer -ip.bind=0.0.0.0 -port=8888 -master=master:9333
      -defaultStoreDir=/data
    ports: ["127.0.0.1:8888:8888"]
    volumes: [filer-data:/data]
    mem_limit: 256m
    depends_on:
      volume1: {condition: service_healthy}
      volume2: {condition: service_healthy}
    healthcheck:
      # Any HTTP answer means the filer is up
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8888/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  s3:
    <<: *seaweedfs
    hostname: s3
    entrypoint: ["/bin/sh", "/scripts/s3-start.sh"]
    environment: &s3-keys
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY}
      S3_INGEST_ACCESS_KEY: ${S3_INGEST_ACCESS_KEY}
      S3_INGEST_SECRET_KEY: ${S3_INGEST_SECRET_KEY}
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY}
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY}
    volumes: ["./storage/s3-start.sh:/scripts/s3-start.sh:ro"]
    # Published on this machine only, for the forecasting application
    ports: ["127.0.0.1:8333:8333"]
    mem_limit: 256m
    depends_on:
      filer: {condition: service_healthy}
    healthcheck:
      # Any HTTP answer (including 403) means the gateway is up
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Runs once: creates the buckets, then exits
  storage-init:
    <<: *seaweedfs
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    volumes: ["./storage/init-buckets.sh:/scripts/init-buckets.sh:ro"]
    restart: "no"
    depends_on:
      filer: {condition: service_healthy}

  # On demand (later started by the scheduler): loads monthly CSVs into raw.
  #   docker compose run --rm ingestion --month 2014-04
  #   docker compose run --rm ingestion --all
  ingestion:
    <<: *common
    profiles: [jobs]
    build: &ingestion-build
      context: ./ingestion
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    image: uber-pipeline/ingestion:1.0
    restart: "no"
    environment: &ingestion-env
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_INGEST_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_INGEST_SECRET_KEY}
      DATA_DIR: /data
    volumes: ["./data:/data:ro"]
    mem_limit: 256m
    depends_on:
      s3: {condition: service_healthy}

  # On demand (later started by the scheduler): PySpark jobs.
  #   docker compose run --rm spark test
  #   docker compose run --rm spark validate --month 2014-04
  spark:
    <<: *common
    profiles: [jobs]
    build: &spark-build
      context: ./spark
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-apache/spark:4.2.0-scala2.13-java17-python3-ubuntu}
    image: uber-pipeline/spark:1.0
    restart: "no"
    environment: &spark-env
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SPARK_SECRET_KEY}
      # Newer AWS SDKs add checksum headers by default; send them only when required
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    mem_limit: 3g
    depends_on:
      s3: {condition: service_healthy}

  # ---- Scheduled operation ----------------------------------------------
  # The workers run the same images as the on-demand jobs above, behind a
  # small HTTP job server, so the scheduler can start jobs over the private
  # network without access to Docker. No ports are published.
  ingestion-worker:
    <<: *common
    build: *ingestion-build
    image: uber-pipeline/ingestion:1.0
    entrypoint: ["python", "/runner/job_server.py"]
    environment:
      <<: *ingestion-env
      JOB_COMMAND: python /app/ingest.py
    volumes:
      - ./data:/data:ro
      - ./runner/job_server.py:/runner/job_server.py:ro
    mem_limit: 256m
    depends_on:
      s3: {condition: service_healthy}
    healthcheck: &worker-health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  spark-worker:
    <<: *common
    build: *spark-build
    image: uber-pipeline/spark:1.0
    entrypoint: ["python3", "/runner/job_server.py"]
    environment:
      <<: *spark-env
      JOB_COMMAND: /app/run.sh
    volumes:
      - ./runner/job_server.py:/runner/job_server.py:ro
    mem_limit: 3g
    depends_on:
      s3: {condition: service_healthy}
    healthcheck: *worker-health

  scheduler:
    <<: *common
    build:
      context: ./scheduler
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    image: uber-pipeline/scheduler:1.0
    environment:
      INGESTION_URL: http://ingestion-worker:8000
      SPARK_URL: http://spark-worker:8000
      MONTHLY_CRON: ${MONTHLY_CRON:-0 2 1 * *}
      QUARTERLY_CRON: ${QUARTERLY_CRON:-0 4 1 1,4,7,10 *}
      RUN_ON_START: ${RUN_ON_START:-true}
      RETRY_DELAYS: ${RETRY_DELAYS:-30,60,120}
    volumes: [scheduler-state:/state]
    mem_limit: 256m
    depends_on:
      storage-init: {condition: service_completed_successfully}
      ingestion-worker: {condition: service_healthy}
      spark-worker: {condition: service_healthy}

  # On demand: verifies that each S3 identity has exactly its intended access
  access-check:
    <<: *common
    profiles: [check]
    image: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    restart: "no"
    environment:
      <<: *s3-keys
      S3_ENDPOINT: http://s3:8333
    volumes: ["./tools/check_access.py:/tools/check_access.py:ro"]
    command: ["sh", "-c", "pip install --quiet --disable-pip-version-check boto3==1.35.* && python /tools/check_access.py"]
    depends_on:
      s3: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}

networks:
  pipeline-net:
    driver: bridge

volumes:
  scheduler-state:
  master-data:
  volume1-data:
  volume2-data:
  filer-data: