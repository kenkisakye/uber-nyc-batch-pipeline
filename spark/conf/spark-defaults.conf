# Spark settings for this pipeline. Access keys are added at runtime from
# environment variables, never written here.

# One container, all cores; sized for a 16 GB laptop
spark.master                                     local[*]
spark.driver.memory                              2g
spark.sql.shuffle.partitions                     8
spark.ui.showConsoleProgress                     false

# Pickup times in the source are local New York times without a zone;
# UTC as session zone keeps Spark from shifting them.
spark.sql.session.timeZone                       UTC

# SeaweedFS S3 gateway
spark.hadoop.fs.s3a.endpoint                     http://s3:8333
spark.hadoop.fs.s3a.endpoint.region              us-east-1
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.connection.ssl.enabled       false
spark.hadoop.fs.s3a.aws.credentials.provider     org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.change.detection.version.required  false
# Plain S3 read stream; the newer "analytics" stream is tuned for Amazon S3
spark.hadoop.fs.s3a.input.stream.type            classic

# Retry storage calls before failing the job
spark.hadoop.fs.s3a.attempts.maximum             5
spark.hadoop.fs.s3a.retry.limit                  5
